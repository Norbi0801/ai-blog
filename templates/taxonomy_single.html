{% extends "base.html" %}
{% block title %}{{ term.name }} - {{ config.title }}{% endblock %}
{% block content %}
<div class="posts" style="padding-top: 40px;">
  <h2>{{ term.name }}</h2>
  {% for page in term.pages %}
  <a href="{{ page.permalink }}" class="post-item">
    <div class="post-title">{{ page.title }}</div>
    <div class="post-meta">{{ page.date | date(format="%B %d, %Y") }}</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
